[storage]
enabled = true
file_size_limit = "50MiB"

# -------------
# Auth defaults

[auth]
enabled = true
site_url = "https://mcp.mplifi.nl"
additional_redirect_urls = ["https://mcp.mplifi.nl/**", "https://instant-setup-kit.lovable.app/**", "https://098d4be4-b790-4fca-9806-d5dd653b8946.lovableproject.com/**", "https://id-preview--098d4be4-b790-4fca-9806-d5dd653b8946.lovable.app/**", "http://localhost:5173/**"]
minimum_password_length = 32
password_requirements= "lower_upper_letters_digits_symbols"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"
otp_length = 8
otp_expiry = 1800

[auth.email.template.magic_link]
subject = "Je inloglink"
content_path = "./docs/email-templates/magic-link.html"

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "noreply@popschoolharderwijk.nl"
sender_name = "Popschool Harderwijk"

[auth.rate_limit]
email_sent = 500
# Number of SMS messages that can be sent per hour. Requires auth.sms to be enabled.
sms_sent = 30
# Number of anonymous sign-ins that can be made per hour per IP address. Requires enable_anonymous_sign_ins = true.
anonymous_users = 1
# Number of sessions that can be refreshed in a 5 minute interval per IP address.
token_refresh = 150
# Number of sign up and sign-in requests that can be made in a 5 minute interval per IP address (excludes anonymous users).
sign_in_sign_ups = 30
# Number of OTP / Magic link verifications that can be made in a 5 minute interval per IP address.
token_verifications = 30
# Number of Web3 logins that can be made in a 5 minute interval per IP address.
web3 = 30

# -------------
# Remote Auth Overrides
# These settings override [auth] defaults when pushing to remote projects

[remotes.test.auth]
site_url = "https://mcp.mplifi.nl"
additional_redirect_urls = ["https://mcp.mplifi.nl/**", "https://instant-setup-kit.lovable.app/**", "https://098d4be4-b790-4fca-9806-d5dd653b8946.lovableproject.com/**", "https://id-preview--098d4be4-b790-4fca-9806-d5dd653b8946.lovable.app/**", "http://localhost:5173/**"]

[remotes.dev.auth]
site_url = "https://mcp.mplifi.nl"
additional_redirect_urls = ["https://mcp.mplifi.nl/**", "https://instant-setup-kit.lovable.app/**", "https://098d4be4-b790-4fca-9806-d5dd653b8946.lovableproject.com/**", "https://id-preview--098d4be4-b790-4fca-9806-d5dd653b8946.lovable.app/**", "http://localhost:5173/**"]

[remotes.prod.auth]
site_url = "https://mcp.mplifi.nl"
additional_redirect_urls = ["https://mcp.mplifi.nl/**"]

# Tighter than test/dev: stop inbox spam and cheap login DoS. Magic links stay valid 30m.
[remotes.prod.auth.email]
max_frequency = "60s"

[remotes.prod.auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 10
token_verifications = 10

# ---------
# Edge function settings
#
# FIXME: verify_jwt = true returns 401 on POST requests, even with a valid JWT.
# The JWT uses ES256 (asymmetric signing) but the Edge Runtime doesn't seem to
# verify it correctly. Manual verification via supabase.auth.getUser() in the
# function code works fine. Investigate later if this is a Supabase bug or
# configuration issue.

[functions.delete-user]
verify_jwt = false

[functions.create-user]
verify_jwt = false

[functions.generate-invoice]
verify_jwt = false

[functions.get-invoice-pdf]
verify_jwt = false

# Stripe webhook is publiek — signature wordt in de function geverifieerd
[functions.stripe-webhook]
verify_jwt = false
