name: PR - CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  pull-request-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI
        run: bun check:ci

      - name: Run Fallow
        run: bun check:fallow

      - name: Lint SQL migrations (Squawk)
        run: bun lint:sql

